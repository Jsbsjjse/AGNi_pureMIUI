name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 是否自动上传到 Release
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build Kernel haydn
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 python2 gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

    - name: Setup Cache (ccache)
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-haydn-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-haydn-
          kernel-ccache-

    - name: Setup Toolchain (Google Clang r522817)
      run: |
        mkdir -p $HOME/google-clang
        cd $HOME/google-clang
        # 使用 AOSP 官方预编译 Clang r522817 (Android 14 使用的版本)
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r29/clang-r522817.tar.gz
        tar -zxf clang-r522817.tar.gz
        cd bin
        # 确保 aarch64-linux-android- 前缀链接存在（实际该包已自带）
        for tool in clang clang++ ld.lld lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
          if [ -f $tool ]; then
            ln -sf $tool aarch64-linux-android-$tool 2>/dev/null || true
          fi
        done
        ln -sf ld.lld aarch64-linux-android-ld 2>/dev/null || true
        cd ../..
        echo "CLANG_PATH=$HOME/google-clang/bin" >> $GITHUB_ENV

    - name: Patch build_kernel_haydn.sh (remove NoKernelSU & disable LTO)
      run: |
        # 备份原脚本
        cp build_kernel_haydn.sh build_kernel_haydn.sh.bak
        # 删除从 "#############################  NO KERNELSU  #######################################" 开始的所有行
        sed -i '/NO KERNELSU/,/fi/d' build_kernel_haydn.sh
        # 在 "make O=$COMPILEDIR_HAYDN $CONFIG1" 之后插入禁用 LTO 的命令
        sed -i '/make O=\$COMPILEDIR_HAYDN \$CONFIG1/a\ \n# 强制禁用 ThinLTO\n$KERNELDIR/scripts/config --file $COMPILEDIR_HAYDN/.config --disable CONFIG_LTO_CLANG_THIN --disable CONFIG_LTO_CLANG_FULL --enable CONFIG_LTO_NONE\nmake O=$COMPILEDIR_HAYDN olddefconfig' build_kernel_haydn.sh
        # 确保脚本中不再重复编译 NoKernelSU
        echo "Script patched successfully"

    - name: Prepare environment
      run: |
        mkdir -p ~/WORKING_DIRECTORY
        cat > ~/WORKING_DIRECTORY/snapdragon_llvm.sh << 'EOF'
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        export PATH="$HOME/google-clang/bin:$PATH"
        EOF
        touch ~/WORKING_DIRECTORY/AGNi_stamp.sh
        if [ ! -f AGNi_version.sh ]; then
          echo 'export AGNI_VERSION="v7.10"' > AGNi_version.sh
        fi
        echo "COMPILEDIR_HAYDN=$GITHUB_WORKSPACE/OUTPUT" >> $GITHUB_ENV
        echo "READY_ZIP=$GITHUB_WORKSPACE/READY_ZIP" >> $GITHUB_ENV

    - name: Run build_kernel_haydn.sh
      run: |
        export PATH="$HOME/google-clang/bin:$PATH"
        export CC=clang
        export LD=ld.lld
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        export CCACHE_DISABLE=1
        export COMPILEDIR_HAYDN="$GITHUB_WORKSPACE/OUTPUT"
        export READY_ZIP="$GITHUB_WORKSPACE/READY_ZIP"
        mkdir -p "$COMPILEDIR_HAYDN" "$READY_ZIP"
        chmod +x build_kernel_haydn.sh
        bash -x build_kernel_haydn.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Kernel-haydn-${{ github.run_number }}
        path: ./*.zip
        if-no-files-found: error

    - name: Publish to Release
      if: ${{ inputs.publish_release == true }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: haydn-kernel-${{ github.run_number }}
        name: AGNi haydn Kernel ${{ github.run_number }}
        body: 自动编译 | AGNi Kernel + ReSukiSU (无LTO, 单次构建)
        files: ./*.zip
        draft: false
        prerelease: false
