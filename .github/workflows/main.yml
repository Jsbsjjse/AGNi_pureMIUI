name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 是否自动上传到 Release
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build Kernel haydn
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 python2 gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libtinfo5

    - name: Setup Cache (ccache)
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-haydn-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-haydn-
          kernel-ccache-

    - name: Setup LLVM Clang 18 (official)
      run: |
        mkdir -p ${{ github.workspace }}/toolchain
        cd ${{ github.workspace }}/toolchain
        wget --retry-connrefused --waitretry=1 --timeout=20 --tries=5 \
          -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
        tar -xf clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
        mv clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04/* .
        rmdir clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04
        cd bin
        for tool in clang clang++ ld.lld lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
          if [ -f $tool ]; then
            ln -sf $tool aarch64-linux-android-$tool
          fi
        done
        ln -sf ld.lld aarch64-linux-android-ld
        echo "TOOLCHAIN_DIR=${{ github.workspace }}/toolchain" >> $GITHUB_ENV

    - name: Patch build script (remove NoKernelSU & disable LTO)
      run: |
        cp build_kernel_haydn.sh build_kernel_haydn.sh.bak
        # 删除从 "NO KERNELSU" 开始到结尾的所有行
        sed -i '/NO KERNELSU/,$d' build_kernel_haydn.sh
        # 在生成配置后插入禁用 LTO 的命令（先检查 .config 是否存在）
        sed -i '/make O=\$COMPILEDIR_HAYDN \$CONFIG1/a\ \n# Disable ThinLTO\nif [ -f $COMPILEDIR_HAYDN/.config ]; then\n  $KERNELDIR/scripts/config --file $COMPILEDIR_HAYDN/.config --disable CONFIG_LTO_CLANG_THIN --disable CONFIG_LTO_CLANG_FULL --enable CONFIG_LTO_NONE\n  make O=$COMPILEDIR_HAYDN olddefconfig\nfi' build_kernel_haydn.sh

    - name: Prepare environment
      run: |
        mkdir -p ~/WORKING_DIRECTORY
        cat > ~/WORKING_DIRECTORY/snapdragon_llvm.sh << EOF
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        export PATH="${{ env.TOOLCHAIN_DIR }}/bin:\$PATH"
        EOF
        touch ~/WORKING_DIRECTORY/AGNi_stamp.sh
        if [ ! -f AGNi_version.sh ]; then
          echo 'export AGNI_VERSION="v7.10"' > AGNi_version.sh
        fi
        echo "COMPILEDIR_HAYDN=${{ github.workspace }}/OUTPUT" >> $GITHUB_ENV
        echo "READY_ZIP=${{ github.workspace }}/READY_ZIP" >> $GITHUB_ENV

    - name: Run build_kernel_haydn.sh
      run: |
        export PATH="${{ env.TOOLCHAIN_DIR }}/bin:$PATH"
        export CC=clang
        export LD=ld.lld
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        export CCACHE_DISABLE=1
        export COMPILEDIR_HAYDN="${{ github.workspace }}/OUTPUT"
        export READY_ZIP="${{ github.workspace }}/READY_ZIP"
        mkdir -p "$COMPILEDIR_HAYDN" "$READY_ZIP"
        chmod +x build_kernel_haydn.sh
        bash -x build_kernel_haydn.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Kernel-haydn-${{ github.run_number }}
        path: ./*.zip
        if-no-files-found: error

    - name: Publish to Release
      if: ${{ inputs.publish_release == true }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: haydn-kernel-${{ github.run_number }}
        name: AGNi haydn Kernel ${{ github.run_number }}
        body: 自动编译 | AGNi Kernel + ReSukiSU (无LTO, 单次构建, Clang 18)
        files: ./*.zip
        draft: false
        prerelease: false
