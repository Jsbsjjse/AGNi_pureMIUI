name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 是否自动上传到 Release
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build Kernel haydn
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true   # 拉取子模块，避免脚本中硬编码路径依赖

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3

    - name: Install Python 2.7 from source
      run: |
        # 安装编译 Python 2.7 所需的依赖
        sudo apt-get install -y build-essential checkinstall libncursesw5-dev libssl-dev libsqlite3-dev tk-dev libgdbm-dev libc6-dev libbz2-dev libffi-dev
        # 下载 Python 2.7.18 源码
        wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        tar -xzf Python-2.7.18.tgz
        cd Python-2.7.18
        # 配置、编译并安装
        ./configure --enable-optimizations
        make -j$(nproc)
        sudo make install
        # 创建软链接，确保 /usr/bin/env python2 能找到
        sudo ln -sf /usr/local/bin/python2.7 /usr/local/bin/python2
        python2 --version

    - name: Setup Cache (ccache)
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-haydn-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-haydn-
          kernel-ccache-

    - name: Setup Toolchain (ZyC-Clang 16)
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxf Clang-16.0.6-20260510.tar.gz

    - name: Verify Toolchain
      run: |
        ls -la $HOME/zyc-clang/bin/
        $HOME/zyc-clang/bin/clang --version
        echo "Checking ld.lld..."
        ls -la $HOME/zyc-clang/bin/ld.lld || echo "ld.lld not found (will use PATH search)"

    - name: Run build_kernel_haydn.sh
      run: |
        # 将 ZyC-Clang 加入 PATH，并设置必要的环境变量
        export PATH="$HOME/zyc-clang/bin:$PATH"
        export CC=clang
        export LD=ld.lld
        export CROSS_COMPILE=aarch64-linux-android-
        # 如果脚本内还有其他硬编码路径，可在此尝试覆盖
        chmod +x build_kernel_haydn.sh
        bash build_kernel_haydn.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Kernel-haydn-${{ github.run_number }}
        path: ./*.zip
        if-no-files-found: error

    - name: Publish to Release
      if: ${{ inputs.publish_release == true }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: haydn-kernel-${{ github.run_number }}
        name: AGNi haydn Kernel ${{ github.run_number }}
        body: 自动编译 | AGNi Kernel + ReSukiSU
        files: ./*.zip
        draft: false
        prerelease: false
