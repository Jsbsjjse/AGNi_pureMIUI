name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 是否自动上传到 Release
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: Build Kernel haydn
    runs-on: ubuntu-22.04   # 22.04 官方源有 python2

    steps:
    - name: Checkout Source
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Cleanup Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 python2

    - name: Setup Cache (ccache)
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache_mikernel
        key: kernel-ccache-haydn-${{ github.run_id }}
        restore-keys: |
          kernel-ccache-haydn-
          kernel-ccache-

    - name: Setup Toolchain (ZyC-Clang 16)
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxf Clang-16.0.6-20260510.tar.gz

    - name: Prepare environment and fix build script
      run: |
        # 创建 WORKING_DIRECTORY 和 snapdragon_llvm.sh 来覆盖硬编码路径
        mkdir -p ~/WORKING_DIRECTORY
        cat > ~/WORKING_DIRECTORY/snapdragon_llvm.sh << 'EOF'
        export CROSS_COMPILE="$HOME/zyc-clang/bin/aarch64-linux-android-"
        export CROSS_COMPILE_ARM32="$HOME/zyc-clang/bin/arm-linux-androideabi-"
        export CLANG_TRIPLE=aarch64-linux-gnu
        export CROSS_COMPILE_COMPAT="$HOME/zyc-clang/bin/arm-linux-androideabi-"
        export CC=clang
        export LD=ld.lld
        export PATH="$HOME/zyc-clang/bin:$PATH"
        EOF
        # 创建空的 AGNi_stamp.sh 避免 source 失败
        touch ~/WORKING_DIRECTORY/AGNi_stamp.sh
        # 如果仓库没有 AGNi_version.sh，创建一个默认版本
        if [ ! -f AGNi_version.sh ]; then
          echo 'export AGNI_VERSION="v7.10"' > AGNi_version.sh
        fi
        # 设置必须的目录变量，避免 mkdir missing operand
        echo "COMPILEDIR_HAYDN=$GITHUB_WORKSPACE/OUTPUT" >> $GITHUB_ENV
        echo "READY_ZIP=$GITHUB_WORKSPACE/READY_ZIP" >> $GITHUB_ENV

    - name: Run build_kernel_haydn.sh
      run: |
        # 重新导出环境变量（确保子进程可见）
        export PATH="$HOME/zyc-clang/bin:$PATH"
        export CC=clang
        export LD=ld.lld
        export CROSS_COMPILE="$HOME/zyc-clang/bin/aarch64-linux-android-"
        export CROSS_COMPILE_ARM32="$HOME/zyc-clang/bin/arm-linux-androideabi-"
        export CLANG_TRIPLE=aarch64-linux-gnu
        export CROSS_COMPILE_COMPAT="$HOME/zyc-clang/bin/arm-linux-androideabi-"
        export COMPILEDIR_HAYDN="$GITHUB_WORKSPACE/OUTPUT"
        export READY_ZIP="$GITHUB_WORKSPACE/READY_ZIP"
        mkdir -p "$COMPILEDIR_HAYDN" "$READY_ZIP"
        chmod +x build_kernel_haydn.sh
        bash -x build_kernel_haydn.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: Kernel-haydn-${{ github.run_number }}
        path: ./*.zip
        if-no-files-found: error

    - name: Publish to Release
      if: ${{ inputs.publish_release == true }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: haydn-kernel-${{ github.run_number }}
        name: AGNi haydn Kernel ${{ github.run_number }}
        body: 自动编译 | AGNi Kernel + ReSukiSU
        files: ./*.zip
        draft: false
        prerelease: false
